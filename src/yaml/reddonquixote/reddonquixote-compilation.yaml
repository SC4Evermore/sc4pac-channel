group: reddonquixote
name: compilation
version: "2"
subfolder: 360-landmark
info:
  summary: SC4D LEX Legacy - Reddonquixote Compilation
  description: |-
    This SC4 Devotion LEX Legacy Pack features all twelve releases by legendary BATer Reddonquixote, which had been available on the Lot Exchange (LEX) at SC4 Devotion. It includes the contents of 12 previously separate downloads, plus the separate RDQ PropPack Growables by Mattb325 (added to Version 2).
    
    After battling a number of technical issues, software incompatibility ultimately shuttered the LEX (at least in its familiar form from 2007 onward) in June 2023, and this package is designed to collect these dependencies in an easy-to-use form, allowing users to install them all in one go, or carefully select exactly which packs they wish to install.

    There are two versions of this package that exist as separate downloads. One [(MN) is for Maxis Nite](https://www.sc4evermore.com/index.php/downloads/download/21-other/206-sc4d-lex-legacy-reddonquixote-compilation-maxis-night) (the default night settings), while the other [(DN) is for Dark Nite](https://www.sc4evermore.com/index.php/downloads/download/21-other/205-sc4d-lex-legacy-reddonquixote-compilation) and is optimized for use with darker Night Mods, such as the mods by SimFox and gizmo28.

    Some of the Lots in here come with additional Ploppable options, or are Ploppable Only. Ploppable Only Lots are noted as "(Ploppable)" in the installer, and those with options will have the Ploppable option deselectable at a sublevel (click "+" to expand and deselect the Ploppable verison if you do not wish to install it).

    Please note that this pack may receive updates in the near future. Do not redistribute without asking first, mostly as doing so would complicate efforts to properly maintain, update, and provide technical support for the pack.
  author: Reddonquixote (RDQ), Tyberius06
  images:
    - https://www.sc4evermore.com/images/jdownloads/screenshots/RDQ-Mattb325_RDQ_Melb_lg.jpg
  websites:
    - "https://www.sc4evermore.com/index.php/downloads/download/21-other/205-sc4d-lex-legacy-reddonquixote-compilation"
    - "https://www.sc4evermore.com/index.php/downloads/download/21-other/206-sc4d-lex-legacy-reddonquixote-compilation-maxis-night"
dependencies:
