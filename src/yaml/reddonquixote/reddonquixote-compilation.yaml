group: mattb325
name: melbourne-expansion-pack-growables
version: "2"
subfolder: 300-commercial
info:
  summary: RDQ's prop pack modded as growable buildings
  description: |-
    RDQ Melbourne Expansion Pack, by Mattb325.
    ---------------------------------------

    Another file from my 'vault'.

    Some time ago, RDQ, who in my opinion is one of the best batters of all time, separated and released quite a large number of smaller annexes, buildings and props that made up his skyscrapers into a large HD prop-pack. 

    That in itself was no small feat: at the request of a number of noisy community voices, he took it upon himself to split apart his main models to release these smaller components. I know just how much work that entails.

    The prop pack is fantastic. 

    The buildings contain therein essentially provide a small expansion pack on their own, and it is a real shame to see that it hasn't had the traction that it deserves. Possibly because there were no lot files or other similar modding done with the pack (isn't it ironic that the noisy, empty-headed voices, who - trotting out the same old tired, hackneyed lines - demanded on the forums that RDQ split up all of his models so that the 'community' could get 'maximum benefit' to re-use the files, then let them languish for over two years with only the occasional use here and there? These are the same empty-heads who carry on as the world is about to end when a batter dares to include the ground in his or her model.) 

    Regardless, even if the empty heads did nothing with RDQ's prop pack after demanding he split his scenes into component files, I am truly grateful, and hopefully this upload puts these models front and centre, as they deserve. 

    In making use of the prop pack, I have turned all the buildings into Commercial growables (CO and CS) and, because they weren't actually designed as standalone buildings, I have in some cases doubled them up to make them suitable for wall to wall applications (which is what they are in real life, but don't conform to the 16m scale of SC4). 

    In letting RDQ's prop pack shine, I have used ONLY his models and the base game props. There are no dependencies beyond his prop pack.

    These grow on all tilesets. 

    I have also made two of the buildings (which are churches) as non-conditional rewards.

    Given the number of lots and files, I am not listing out individual stats: like all my uploads the stats are balanced and made with the PIM-X.

    Credit for every model to RDQ.

    ---------------------------------------

    STATS CS§§ & CS§§§:        
      
    Lot size: 	     2x2, 1x3, 2x3, 2x4 and 6x6
    Growth Stage:	     1-7 (Low, Medium and High Density Zoning)
    Building Style:      Chicago/NY/Houston/Euro
    Occupant Group:	     Medium and High Wealth Commercial Services Buildings


