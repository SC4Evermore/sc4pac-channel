group: reddonquixote
name: statue-of-liberty
version: "2"
subfolder: 360-landmark
info:
  summary: Statue of Liberty in oxidized copper color, as it appears currently
  description: |-
    Statue of Liberty, New York City, USA

    "Give me your tired, your poor,
    Your huddled masses yearning to breathe free,
    The wretched refuse of your teeming shore.
    Send these, the homeless, tempest-tost to me,
    I lift my lamp beside the golden door!"

    The Statue of Liberty is a colossal neoclassical sculpture on Liberty Island in New York Harbor in New York City. It was designed by French sculptor Frédéric Auguste Bartholdi and dedicated 1886. The statue is of a robed female figure bearing a torch and tablet. A broken chain lies at her feet. The statue is an icon of freedom and of the United States, a welcoming signal to immigrants arriving from abroad.

    Source: Wikipedia (http://en.wikipedia.org/wiki/Statue_of_Liberty)

    This is my 31st BAT, and my very first BAT release for the LEX.

    The Statue of Liberty is a Landmark that comes in two versions.

    1) Statue of Liberty, is an overhanging prop that sits on 1x1 lot. Costs §2500 to build and §150 per month.
    This is the familar patina green version atop a tiered platform, as we see today.

    2) Statue of Liberty 1886, is an overhanging prop that sits on 1x1 lot. Costs §2500 to build and §150 per month.
    This is a copper metal version on a grassy mound, as she first appeared in 1886.
    Delete folder 'RDQ_Statue_Of_Liberty_1886_Prop_XN' if you don't want the old copper statue.

    You can use both!

    Instructions:
    1) If you use Darknite, delete the folder RDQ_Statue_Of_Liberty_MN. Otherwsie, delete the folder RDQ_Statue_Of_Liberty_DN.
    2) Don't delete the folder RDQ_Statue_Of_Liberty_Building or you will get the dreaded brown box.
    3) Place 2 remaining folders into your SC4 plugins folder.

    Enjoy!
  author: Reddonquixote (RDQ)
  images:
    - https://www.sc4evermore.com/images/sc4pac/reddonquixote/RDQ_SoLNY_Day_Image_Primary.jpg
    - https://www.sc4evermore.com/images/sc4pac/reddonquixote/RDQ_SoLNY_Night_Image_Primary.jpg
    - https://www.sc4evermore.com/images/sc4pac/reddonquixote/RDQ_SoLNY_Main_Pic.jpg
  websites:
