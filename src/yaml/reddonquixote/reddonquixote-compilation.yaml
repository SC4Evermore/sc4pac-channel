info:
  summary: The Chrysler Building
  description: |-
    Chrysler Building, New York City, USA

    The Chrysler Building is an Art Deco style skyscraper located in Manhattan at the intersection of 42nd Street and Lexington Avenue. Completed in 1930, at 319m it is the tallest brick building in the world. The Chrysler Building is the 4th tallest building in New York, (tied equal height with The New York Times Building, 2007)

    The Chrysler Building is a classic example of Art Deco architecture and considered by many contemporary architects to be one of the finest buildings in New York City.

    Source: Wikipedia

    This is my 33rd BAT.

    There are 3 versions of the Chrysler Building, they are all available in Darknite and Maxis Night.

    - CO$$$ growable (Stage 8, CAMpatible - but CAM not required)
      Lot Size: 4*4
      Commercial Office Jobs: Co$$$ - 3143, Co$$ - 4492
    - Functional CO$$$ Landmark
    - EyeCandy Landmark

    Huge thanks and credit goes to CasperVg for all the modding on this BAT.

    Enjoy!
