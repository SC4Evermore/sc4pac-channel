name: st-pauls-cathedral
version: "2"
subfolder: 650-religion
info:
  summary: St Paul's Cathedral in London, UK
  description: |-
    St Pauls Cathedral, London, England

    St Paul's is an Anglican Cathedral and sits at the top of Ludgate Hill, the highest point in the City of London. The present church, dating from the late 17th century, was designed in the English Baroque style by Sir Christopher Wren. Its construction was part of a major rebuilding programme which took place in the city after the Great Fire of London.

    The cathedral is one of the most famous and recognizable sights of London, with its dome dominating the skyline for 300 years, its dome is also among the highest in the world.

    The cathedral was declared officially complete by Parliament on 25 December 1711 although construction was to continue for several years after that, with the statues on the roof only being added in the 1720s. In 1716 the total costs amounted to £1,095,556 (£143 million in 2015).

    Source: Wikipedia (http://en.wikipedia.org/wiki/St_Paul%27s_Cathedral)

    This is my 32nd BAT.

    St Pauls Cathedral is a House of Worship, Landmark with Park Effect. It is an overhanging prop that sits on 5x5 lot. Costs §2500 to build and §150 per month to maintain.

    Enjoy!
  author: Reddonquixote (RDQ)
