info:
  summary: HD Sidewalk Pack and Maxis Texture Replacements
  description: |-
    This pack includes a variety of 10 custom HD Sidewalk Texture mods ranging from Cobblestone, Cement, Brick and Mortar sidewalks. This mod is highly customizable, allowing you to choose a different sidewalk texture for each wealth level ($, $$, $$$), or even mix and match between different sidewalk mods. The textures are compatible with the BSC Sidewalks and SCILT (Sidewalk Compatible Interchangeable Lot Textures) mods.

    The pack also includes a plugin to replace the Maxis plaza base and overlay textures. Use this plugin with ANY sidewalk texture to better blend the new sidewalk with lot bases.
