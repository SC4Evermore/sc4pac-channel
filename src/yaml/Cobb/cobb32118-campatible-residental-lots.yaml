info:
  summary: Cobb32118 Collection Pack
  description: |
    A collection of 26 growable lots by Cobb32118 (19 residential and 7 commercial) and the ploppable versions of several buildings. It installs `pkg=cobb:residential-set` and `pkg=cobb:commercial-set`.

    This collection has the same buildings and lot IDs as the original Simtropolis uploads of The Cobb Altura Tower, Atlantic, Central Park West, Emerald Park, Emperador, 5th Avenue, Europa, Galleria, Grand Plaza, Oceanic, Park Plaza, Regency, Riviera, Royale, Seaside Villa, Shoreline, Tower, Troglodyte Complex and Veinte Building, and The 13th Street Condos. The lots have been updated to be compatible with CAM: growth stages, capacities, costs and occupant groups differ from the originals. Because the lot IDs are the same, install either the collection or an original upload, not both.

    **CAM variant**
    - `CAM: yes`: all growable lots are installed.
    - `CAM: no`: only the growable lots that do not need CAM are installed. The 13th Street Condos, Atlantic, Park Plaza, Shoreline and Veinte have no lots at all, and Altura Tower, Emerald Park, Emperador, Galleria, Oceanic and Tower only have their ploppable lots.

    The collection also has 7 commercial lots (hotels and offices) that are not part of any of the original residential uploads.
