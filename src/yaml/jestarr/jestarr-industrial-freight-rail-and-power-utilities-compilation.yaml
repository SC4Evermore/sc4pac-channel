version: "2"
subfolder: 400-industrial
info:
  summary: Owosso Beet Sugar Factory (freight rail)
  description: |-
    Founded in 1902, the Ossowo sugar beet plant operated until 1924, when it was purchased by the Michigan Sugar Company. At this time, the plant was basically closed, and only used for storage until the beets could be transferred to a plant in Saginaw. Although the plant still exists, it's scheduled to be demolished and the land redeveloped. There is one lot included; a 12x7 ploppable freight station, TE'd for freight rail and truck. The rail TE'd lots only allow freight traffic through, so should be placed on a spur off the main line, so as not to max out your capacity. These lots are BTE enabled and will contribute to industrial reward chains.
