name: freight-rail-railway-express-agency
version: "2"
subfolder: 400-industrial
info:
  summary: Railway Express Agency (freight rail)
  description: |-
    The American Railway Express Agency was founded on March 29, 1839. On November 1, 1866, Wells Fargo & Co. purchased the stage and Pony Express operations from Ben Holladay. At this time, there were several express companies; however, by 1914 there were only seven. During World War I, these seven companies were consolidated, at the direction of the US Federal Government, into one nationwide organization, The American Railway Express Agency. In 1929, the nation's railroads bought the express business and changed the name to Railway Express Agency, Inc.
  author: Jestarr (JES), BSC
  websites:
