version: "2"
subfolder: 400-industrial
info:
  summary: Cal Fame Packing Shed (freight rail)
  description: |-
    Here you have the Cal Fame Packing Shed "loosely" based on a citrus packing plant that once stood in Escondido, California (about 30 miles north of San Diego). This plant was first opened in 1935 by the Escondido Orange Association and continued processing citrus fruits until 1987 when it was closed down.

    Note: This lot acts as a freight station and, as such, should be placed on a spur, as passenger traffic will not pass through. 
  author: Jestarr (JES), BSC
  websites:
