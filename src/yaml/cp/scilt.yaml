info:
  summary: "Sidewalk Compatible Interchangeable Lot Textures (SCILT)"
  description: |-
    This is a collection of lot textures intended to match the texture of your sidewalk mod. Note that for this version, the sidewalk mod is included, meaning the sidewalk textures in your game will change to this texture. The lot textures should be useful on lots where the sidewalk texture needs to be extended onto the lot, or for paths, plazas, patios, etc.

    The different versions are interchangeable, meaning if you remove one version from your plugins and replace it with another, the game will show the new SCILT textures on your lots in place of the old SCILT textures. These BSC Sidewalk Mods are based on base textures that can originally be found in the BSC Textures Vol01, BSC Textures Vol02 and BSC Textures Vol03 dependency packs.
  author: "CycleDogg/CP"
  images:
  - "https://www.sc4evermore.com/images/jdownloads/screenshots/scilt-cp-and-bsc.jpg"
  - "https://www.sc4evermore.com/images/jdownloads/screenshots/Preview.JPG"
  website: "https://www.sc4evermore.com/index.php/downloads/download/44-sidewalks/430-sc4d-lex-legacy-bsc-cp-sidewalk-and-scilt-compilation"
