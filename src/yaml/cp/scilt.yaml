info:
  summary: HD Sidewalk Pack and Maxis Plaza Texture Replacements
  description: |-
    This SC4 Devotion LEX Legacy Pack features all 15 SideWalk (SW) mods and their Sidewalk Compatible Interchangeable Lot Textures (SCILT) created by legendary custom content creator CycleDogg/CP, which had been available on the Lot Exchange (LEX) at SC4 Devotion. This mod is highly customizable, allowing you to choose a different sidewalk texture for each wealth level ($, $$, $$$), or even mix and match between different sidewalk mods. The textures are compatible with the Gobias Sidewalks and SCILT (Sidewalk Compatible Interchangeable Lot Textures) mods.

    The pack also includes a plugin to replace the Maxis plaza base and overlay textures. Use this plugin with ANY sidewalk texture to better blend the new sidewalk with lot bases.
