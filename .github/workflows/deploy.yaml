name: Deploy channel
run-name: "Deploy channel: ${{ github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows: ["sc4pac CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false
    - name: Download channel artifact
      uses: actions/download-artifact@v8
      with:
        name: channel-artifact.zip
        path: tmp_gh-pages
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Update coverage report
      run: python3 scripts/scan-coverage.py
      continue-on-error: true
    - name: Copy coverage report to pages output
      run: cp -r docs tmp_gh-pages/docs
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Upload artifact
      # note that this action dereferences our `latest` symlinks, but that's not a huge problem, it just duplicates each json file (could maybe be avoided by using tar)
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'tmp_gh-pages'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
    permissions:
      contents: read
      actions: read                  # to download artifacts from the CI run
      pages: write
      id-token: write